name: Verify application

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app.py api.py src tests
      - run: python -m pytest -q
      - run: python src/monitor.py

  container-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag luma-ci:verify .
      - name: Test with the production Python and runtime dependencies
        run: |
          docker run --rm --security-opt no-new-privileges:true luma-ci:verify \
            sh -c 'python -m pip install --user --no-cache-dir --no-warn-script-location -r requirements-dev.txt && python -m pip check && python -m pytest -q'
