services:
  - type: web
    name: luma-gadget-impact
    runtime: docker
    plan: free
    dockerCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /_stcore/health
    autoDeploy: true

  - type: web
    name: luma-gadget-impact-api
    runtime: docker
    plan: free
    dockerCommand: uvicorn api:app --host 0.0.0.0 --port=$PORT
    healthCheckPath: /health/ready
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://luma-gadget-impact.onrender.com
    autoDeploy: true
